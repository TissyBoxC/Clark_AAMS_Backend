spring.application.name=Clark_AAMS_Backend
app.version=1.0.0
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Configure admin credentials outside git, for example:
# CLARK_AAMS_ADMIN_USERNAME=your-admin-username
# CLARK_AAMS_ADMIN_PASSWORD=your-admin-password
# If these are not configured, initialize the admin account with POST /api/v1/admin/auth/register.
# clark-aams.admin.config-path=/path/to/admin-config.json
# Cross-origin API access. Default is all origins.
clark-aams.cors.allowed-origin-patterns=*

# Optional: set a custom path for runtime AI provider config.
# clark-aams.ai.config-path=/path/to/ai-config.json
# Optional: set a custom dir for pickup code JSON and uploaded images.
# clark-aams.pickup.storage-dir=/path/to/course-pickups
# Optional: set a custom dir for html samples from unsupported schools.
# clark-aams.import.unsupported-html-dir=/path/to/unsupported-school-html
# Optional: set a custom path for local user persistence (SQLite file).
# clark-aams.user.db-path=/path/to/users.db
# Optional: set a custom path for email sender config.
# clark-aams.email.config-path=/path/to/email-config.json

# --- 数据目录（P5-2）---
# 设置环境变量 CLARK_AAMS_DATA_DIR 即可一次性挪走全部可变数据：
#   users.db        -> $CLARK_AAMS_DATA_DIR/users.db
#   course-pickups  -> $CLARK_AAMS_DATA_DIR/course-pickups/
# 用于容器/只读镜像（jar 目录不可写）以及桌面安装包升级（jar 被替换但数据要保留）。
# 上面的 db-path / storage-dir 优先级更高，可单独覆盖其中一项。
# 示例：CLARK_AAMS_DATA_DIR=/var/lib/clark-aams

clark-aams.client-version.latest-version=1.8.1
clark-aams.client-version.latest-build=22
clark-aams.client-version.minimum-supported-version=1.7.0
clark-aams.client-version.minimum-supported-build=20
clark-aams.client-version.title=发现新版本
clark-aams.client-version.optional-update-message=有新版本可用，建议更新后继续使用。
clark-aams.client-version.required-update-message=当前版本已停止支持，请更新后继续使用。
clark-aams.client-version.release-page-url=https://gitee.com/your-org/clark-aams/releases
clark-aams.client-version.release-notes[0]=后端已支持学校列表、教务导入和版本检查。
clark-aams.client-version.download-sources[0].type=gitee
clark-aams.client-version.download-sources[0].label=Gitee 下载
clark-aams.client-version.download-sources[0].url=https://gitee.com/your-org/clark-aams/releases
clark-aams.client-version.download-sources[0].primary=true
clark-aams.client-version.download-sources[0].description=推荐国内网络使用
clark-aams.client-version.download-sources[1].type=git
clark-aams.client-version.download-sources[1].label=Git 仓库
clark-aams.client-version.download-sources[1].url=https://gitee.com/your-org/clark-aams.git
clark-aams.client-version.download-sources[1].primary=false
clark-aams.client-version.download-sources[1].description=开发者可从仓库拉取源码
