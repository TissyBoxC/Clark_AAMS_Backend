name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 v1.0.0）；留空则用 0.0.1-SNAPSHOT'
        required: false

permissions:
  contents: write

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run tests
        run: ./gradlew test --no-daemon --stacktrace
        continue-on-error: true

      - name: Build bootJar
        run: ./gradlew bootJar --no-daemon --stacktrace

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            V="${{ github.event.inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            V="${GITHUB_REF#refs/tags/}"
          else
            V="0.0.1-SNAPSHOT"
          fi
          echo "tag=$V" >> "$GITHUB_OUTPUT"
          echo "tag: $V"

      - name: Collect artifacts
        run: |
          mkdir -p out
          JAR=$(ls build/libs/*.jar | grep -v -- '-plain.jar' | head -1)
          echo "picked: $JAR"
          cp "$JAR" "out/Clark_AAMS_Backend_${{ steps.version.outputs.tag }}.jar"
          ls -lh out
          (cd out && sha256sum *.jar > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: clark-aams-backend-jar
          path: out/*.jar
          retention-days: 30

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Clark AAMS Backend ${{ steps.version.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            Clark AAMS Backend ${{ steps.version.outputs.tag }}

            - 提交：${{ github.sha }}
            - 构建：GitHub Actions，JDK 21，Gradle Wrapper 9.4.1，Spring Boot 4.0.6

            运行方式：

            ```bash
            java -jar Clark_AAMS_Backend_${{ steps.version.outputs.tag }}.jar
            ```

            首次启动会生成 `admin-config.json`，管理员凭据见后端 README。
            运行时数据（`users.db`、`course-pickups/`、`*-config.json`）不随包分发。
          files: out/*.jar
